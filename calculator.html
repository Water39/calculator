<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор стоимости заказа</title>
    <link rel="stylesheet" href="stylecal.css">
</head>
<body>
    <div class="calculator">
        <h2>Калькулятор заказа</h2>
        <div class="form-group">
            <label for="productSelect">Выберите товар:</label>
            <select id="productSelect">
                <option value="500">Товар А (500 руб.)</option>
                <option value="1200">Товар Б (1200 руб.)</option>
                <option value="300">Товар В (300 руб.)</option>
                <option value="2500">Товар Г (2500 руб.)</option>
            </select>
        </div>
        <div class="form-group">
            <label for="quantityInput">Количество:</label>
            <input type="number" id="quantityInput" value="1" min="1">
        </div>
        <button id="calculateBtn">Подсчитать стоимость</button>
        <div class="result" id="resultOutput"></div>
    </div>
    <script src="scriptcal.js"></script>
</body>
</html>
